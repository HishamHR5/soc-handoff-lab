[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soclab"
version = "0.2.0"
description = "SOC Handoff Lab: log-borne prompt injection and poisoned agents in a multi-agent SOC pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hisham R S" }]
license = { text = "MIT" }
dependencies = [
  "langgraph>=1.0",
  "openai>=1.40",
  "anthropic>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
]
# Laundering detection with a local embedding model (downloads the model once).
embeddings = ["sentence-transformers>=3.0"]
# Propagation Viewer (http://localhost:8501):  streamlit run viewer/app.py
viewer = ["streamlit>=1.40"]
# Optional trace viewer (http://localhost:6006).
phoenix = [
  "arize-phoenix",
  "arize-phoenix-otel",
  "openinference-instrumentation-openai",
  "openinference-instrumentation-langchain",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soclab = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["soclab"]
branch = false

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
